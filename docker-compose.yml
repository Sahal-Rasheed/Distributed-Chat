services:
  db:
    image: postgres:16-alpine
    container_name: distributed-chat-db
    restart: always
    env_file: ./.env
    ports:
      - "5432:5432"
    volumes:
      - distributed_chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - distributed-chat-network

  redis:
    image: redis:7-alpine
    container_name: distributed-chat-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - distributed-chat-network

  app1:
    build: .
    container_name: distributed-chat-app-1
    volumes:
      - .:/app
      # - /app/.venv # don't override .venv since using uv
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - distributed-chat-network
  
  app2:
    build: .
    container_name: distributed-chat-app-2
    volumes:
      - .:/app
      # - /app/.venv # don't override .venv since using uv
    env_file:
      - ./.env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - distributed-chat-network

volumes:
  distributed_chat_db_data:

networks:
  distributed-chat-network:
    driver: bridge
