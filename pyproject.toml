[project]
name = "Distributed-Chat-App"
version = "0.1.0"
description = "A distributed chat application built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# asyncio_default_fixture_loop_scope = "session"
# asyncio_default_test_loop_scope = "session"
addopts = "-v -ra -s"
testpaths = ["app/tests"]
markers = [
    "integration: marks tests that require external services",
]
